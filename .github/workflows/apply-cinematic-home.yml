name: Apply BluStream cinematic home UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cinematic-home.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch home screen
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/blustream/app/MainActivity.kt')
          text = p.read_text()
          old = '0 -> HomeScreen(profile, onProfile = { showProfilePicker = true }, onSelect = { selectedTitle = it })'
          new = '0 -> CinematicHomeScreen(profile, onProfile = { showProfilePicker = true }, onSelect = { selectedTitle = it })'
          if old not in text:
              raise SystemExit('home screen target not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit cinematic home switch
        run: |
          git config user.name "BluStream Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/blustream/app/MainActivity.kt
          git commit -m "Use cinematic BluStream home UI"
          git push
