name: Build BluStream Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'
      - '.github/blustream-alpha.keystore.b64'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blustream-android-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wire Genres tab into main UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/blustream/app/BluStreamV20Activity.kt')
          s = p.read_text()
          s = s.replace(
              'private enum class V20Screen { HOME, MOVIES, SHOWS, SEARCH, MY_STUFF, ADDONS, PROFILES, SETTINGS }',
              'private enum class V20Screen { HOME, MOVIES, SHOWS, GENRES, SEARCH, MY_STUFF, ADDONS, PROFILES, SETTINGS }'
          )
          s = s.replace(
              'V20Screen.SHOWS -> V20Catalog("Shows", active!!, "series") { selected = it }\n                    V20Screen.SEARCH ->',
              'V20Screen.SHOWS -> V20Catalog("Shows", active!!, "series") { selected = it }\n                    V20Screen.GENRES -> BluStreamGenres(active!!.kids) { selected = it }\n                    V20Screen.SEARCH ->'
          )
          s = s.replace(
              'V20Screen.SHOWS to "Shows",\n                V20Screen.SEARCH to "Search",',
              'V20Screen.SHOWS to "Shows",\n                V20Screen.GENRES to "Genres",\n                V20Screen.SEARCH to "Search",'
          )
          s = s.replace('Text("BLUSTREAM 2.5"', 'Text("BLUSTREAM 3.1"')
          p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Sign APK with stable BluStream alpha key
        shell: bash
        run: |
          mkdir -p release
          base64 -d .github/blustream-alpha.keystore.b64 > /tmp/blustream-alpha.jks
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks /tmp/blustream-alpha.jks \
            --ks-key-alias blustream \
            --ks-pass pass:blustreamalpha \
            --key-pass pass:blustreamalpha \
            --out release/BluStream-3.1-alpha.apk \
            app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release/BluStream-3.1-alpha.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BluStream-3.1-APK
          path: release/BluStream-3.1-alpha.apk
          if-no-files-found: error

      - name: Publish or update GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v3.1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/BluStream-3.1-alpha.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "BluStream 3.1 Alpha" --notes-file CHANGELOG.md --prerelease
          else
            gh release create "$TAG" release/BluStream-3.1-alpha.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "BluStream 3.1 Alpha" \
              --notes-file CHANGELOG.md \
              --prerelease
          fi