name: Build BluStream Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply source picker build hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/blustream/app/BluStreamShell.kt')
          text = path.read_text()

          old = 'Text("▶ Play ${chosenEpisode?.let { "S${it.season} E${it.episode}" } ?: resolved.name}", fontSize = 17.sp)'
          new = 'val playLabel = chosenEpisode?.let { episode -> "S${episode.season} E${episode.episode}" } ?: resolved.name\n                    Text("▶ Play $playLabel", fontSize = 17.sp)'
          if old in text:
              text = text.replace(old, new)

          single_close = '\n}\n\n@Composable\nprivate fun ProfilePickerV07'
          double_close = '\n}\n}\n\n@Composable\nprivate fun ProfilePickerV07'
          if double_close not in text and single_close in text:
              text = text.replace(single_close, double_close, 1)

          path.write_text(text)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: gradle_build
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            {
              echo "BluStream Android build failed on commit $GITHUB_SHA"
              echo
              echo '```text'
              grep -E "(^e: | error: |Unresolved reference|Cannot access|Type mismatch|No value passed|Too many arguments|FAILURE:|What went wrong|Compilation error|Syntax error)" build.log | tail -n 180
              echo '```'
            } > build-error.md
            exit "$STATUS"
          fi

      - name: Save successful source hotfix
        if: success()
        shell: bash
        run: |
          if ! git diff --quiet -- app/src/main/java/com/blustream/app/BluStreamShell.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/blustream/app/BluStreamShell.kt
            git commit -m "Fix BluStream source picker build [skip ci]"
            git push
          fi

      - name: Report build error
        if: failure() && steps.gradle_build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "CI build error ${GITHUB_RUN_NUMBER}" \
            --body-file build-error.md || true

      - name: Collect APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/BluStream-0.7.0-alpha-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BluStream-0.7.0-alpha-APK
          path: release/BluStream-0.7.0-alpha-debug.apk
          if-no-files-found: error

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.7.0-alpha.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            release/BluStream-0.7.0-alpha-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "BluStream 0.7 Alpha ${GITHUB_RUN_NUMBER}" \
            --notes-file CHANGELOG.md \
            --prerelease
